<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Music Challenge</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",system-ui,sans-serif}
    .bg-game{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 30%,#4c1d95 60%,#1e1b4b 100%);min-height:100vh}
    .card-glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12)}
    .glossy-btn{position:relative;overflow:hidden;transition:all 0.2s ease}
    .glossy-btn::after{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,rgba(255,255,255,0.22),rgba(255,255,255,0.04));pointer-events:none;border-radius:inherit}
    .glossy-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.35)}
    .glossy-btn:active:not(:disabled){transform:translateY(0)}
    .glossy-btn:disabled{opacity:0.45;cursor:default}
    .option-idle{background:linear-gradient(135deg,rgba(59,130,246,0.22),rgba(139,92,246,0.22));border:2px solid rgba(139,92,246,0.4)}
    .option-idle:hover:not(:disabled){background:linear-gradient(135deg,rgba(59,130,246,0.5),rgba(139,92,246,0.5));border-color:rgba(167,139,250,0.85)}
    .option-correct{background:linear-gradient(135deg,#15803d,#16a34a)!important;border:2px solid #4ade80!important}
    .option-wrong{background:linear-gradient(135deg,#b91c1c,#dc2626)!important;border:2px solid #f87171!important}
    .option-dim{opacity:0.28}
    @keyframes correctFlash{0%{transform:scale(1)}50%{transform:scale(1.04);box-shadow:0 0 0 10px rgba(34,197,94,0.25)}100%{transform:scale(1)}}
    .anim-correct{animation:correctFlash 0.55s ease-out}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
    .anim-wrong{animation:wrongShake 0.45s ease-out}
    @keyframes scoreFloat{0%{opacity:1;transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.35)}100%{opacity:0;transform:translateY(-65px) scale(0.8)}}
    .score-float{animation:scoreFloat 1.8s ease-out forwards;position:absolute;pointer-events:none;z-index:50}
    @keyframes b1{0%,100%{height:8px}50%{height:26px}}
    @keyframes b2{0%,100%{height:20px}35%{height:8px}70%{height:28px}}
    @keyframes b3{0%,100%{height:14px}45%{height:28px}80%{height:8px}}
    @keyframes b4{0%,100%{height:22px}50%{height:8px}}
    .bar1{animation:b1 0.6s ease-in-out infinite}
    .bar2{animation:b2 0.8s ease-in-out infinite}
    .bar3{animation:b3 0.7s ease-in-out infinite}
    .bar4{animation:b4 0.9s ease-in-out infinite}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    .fade-in-up{animation:fadeInUp 0.5s ease-out forwards}
    @keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
    .slide-down{animation:slideDown 0.35s ease-out forwards}
    @keyframes pulseGlow{0%,100%{box-shadow:0 0 20px rgba(139,92,246,0.4),0 0 40px rgba(59,130,246,0.2)}50%{box-shadow:0 0 40px rgba(139,92,246,0.8),0 0 80px rgba(59,130,246,0.4)}}
    .pulse-glow{animation:pulseGlow 2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin-slow{animation:spin 1.8s linear infinite}
    @keyframes timerBlink{0%,100%{opacity:1}50%{opacity:0.6}}
    .timer-blink{animation:timerBlink 0.5s ease-in-out infinite}
    /* ── COMBO / FIRE ── */
    @keyframes fireF{0%,100%{transform:translateY(0) scaleX(1) rotate(-3deg)}50%{transform:translateY(-5px) scaleX(0.9) rotate(3deg)}}
    .fire-f{animation:fireF 0.35s ease-in-out infinite}
    @keyframes comboPop{0%{transform:scale(0) rotate(-12deg);opacity:0}65%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
    .combo-pop{animation:comboPop 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards}
    @keyframes comboBg{0%,100%{opacity:0.1}50%{opacity:0.28}}
    .combo-bg{animation:comboBg 0.9s ease-in-out infinite}
    @keyframes fireRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(0.5)}}
    .fire-rise{animation:fireRise 1.6s ease-out forwards}
    @keyframes decadeGlow{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 16px 4px currentColor}}
    @keyframes revealArt{from{opacity:0;transform:scale(0.85) rotateY(25deg)}to{opacity:1;transform:scale(1) rotateY(0)}}
    .reveal-art{animation:revealArt 0.5s cubic-bezier(0.34,1.3,0.64,1) forwards}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.5);border-radius:3px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

const TOTAL_ROUNDS = 10;
const ROUND_TIME = 15;
const BASE_PTS = 1000;
const TIME_MULT = 100;
const COMBO_THRESHOLD = 3;
const LB_KEY = 'mcLB';

/*
 * ── GLOBAL LEADERBOARD (Firebase Realtime Database) ──────────────────────────
 *  1. Go to https://console.firebase.google.com/ and create a free project.
 *  2. In the project, enable "Realtime Database" (Start in test mode is fine).
 *  3. Copy your database URL (looks like https://YOUR-PROJECT-default-rtdb.firebaseio.com)
 *     and paste it below instead of 'YOUR_FIREBASE_DB_URL'.
 *  4. (Optional) Update the security rules to allow only writes, e.g.:
 *     { "rules": { "leaderboard": { ".read": true, ".write": true } } }
 *  Without this config the leaderboard stays local (per-browser, old behaviour).
 * ─────────────────────────────────────────────────────────────────────────────
 */
const FIREBASE_DB_URL = 'YOUR_FIREBASE_DB_URL';
const FIREBASE_ENABLED = FIREBASE_DB_URL !== 'YOUR_FIREBASE_DB_URL';

/* ── Categories config ── */
const CATEGORIES = [
  { id:'pop',    emoji:'🎵', label:'Pop',            color:'#ec4899', glow:'rgba(236,72,153,0.5)',
    terms:['pop hits','pop songs 2023','pop music chart','pop radio hits','pop 2022'] },
  { id:'rock',   emoji:'🎸', label:'Rock',           color:'#ef4444', glow:'rgba(239,68,68,0.5)',
    terms:['rock music','classic rock hits','rock songs','alternative rock','indie rock'] },
  { id:'metal',  emoji:'🤘', label:'Metal',          color:'#6366f1', glow:'rgba(99,102,241,0.5)',
    terms:['heavy metal music','metal songs','thrash metal','hard rock metal','metal classics'] },
  { id:'electro',emoji:'⚡', label:'Electro',        color:'#06b6d4', glow:'rgba(6,182,212,0.5)',
    terms:['electronic music','electro dance','synth pop','dance electronic','edm hits'] },
  { id:'80s',    emoji:'🕺', label:'Lata 80.',       color:'#f59e0b', glow:'rgba(245,158,11,0.5)',
    terms:['80s pop music','80s rock hits','80s greatest hits','1980s music','80s classics'] },
  { id:'90s',    emoji:'💿', label:'Lata 90.',       color:'#10b981', glow:'rgba(16,185,129,0.5)',
    terms:['90s pop music','90s rock hits','90s greatest hits','1990s music','90s classics'] },
];
/* backward compat alias */
const DECADES = CATEGORIES;

const UN_KEY  = 'mcUsername';

/* ── Recent artists (localStorage) ── */
const ART_KEY = 'mcArtists';
function getRecentArtists() {
  try { return JSON.parse(localStorage.getItem(ART_KEY) || '[]'); }
  catch { return []; }
}
function saveRecentArtist(name) {
  const list = getRecentArtists().filter(a => a.toLowerCase() !== name.toLowerCase());
  list.unshift(name);
  if (list.length > 6) list.length = 6;
  localStorage.setItem(ART_KEY, JSON.stringify(list));
}

/* ── Leaderboard helpers ── */
function getLBLocal() {
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }
  catch { return []; }
}
async function loadLB() {
  if (!FIREBASE_ENABLED) return getLBLocal();
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/leaderboard.json`);
    if (!res.ok) throw new Error('fetch error');
    const data = await res.json();
    if (!data) return [];
    const entries = Object.values(data).filter(e =>
      e && typeof e.score === 'number' && e.score >= 0 &&
      typeof e.date === 'string' && typeof e.username === 'string'
    );
    entries.sort((a, b) => b.score - a.score);
    const top10 = entries.slice(0, 10);
    localStorage.setItem(LB_KEY, JSON.stringify(top10));
    return top10;
  } catch {
    return getLBLocal();
  }
}
async function saveLB(entry) {
  /* sanitise entry: only allow expected fields with basic type checks */
  const safe = {
    score:      typeof entry.score === 'number' && entry.score >= 0 ? Math.round(entry.score) : 0,
    date:       typeof entry.date === 'string'  ? entry.date.slice(0, 10)  : '',
    username:   typeof entry.username === 'string' ? entry.username.slice(0, 20) : 'Gracz',
    category:   typeof entry.category === 'string' ? entry.category.slice(0, 20) : null,
    artistName: typeof entry.artistName === 'string' ? entry.artistName.slice(0, 50) : null,
  };

  const localLB = getLBLocal();
  localLB.push(safe);
  localLB.sort((a, b) => b.score - a.score);
  if (localLB.length > 10) localLB.length = 10;
  localStorage.setItem(LB_KEY, JSON.stringify(localLB));
  if (!FIREBASE_ENABLED) return localLB;
  try {
    await fetch(`${FIREBASE_DB_URL}/leaderboard.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(safe),
    });
    return await loadLB();
  } catch {
    return localLB;
  }
}

/* ── SVG Icons ── */
const Ic = {
  Music:   ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
  Trophy:  ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><path d="M7 4v6a5 5 0 0 0 10 0V4"/><polyline points="7 4 3 4 3 8 7 8"/><polyline points="17 4 21 4 21 8 17 8"/></svg>,
  Star:    ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor" stroke="none" className={c}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
  Check:   ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={c}><polyline points="20 6 9 17 4 12"/></svg>,
  X:       ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={c}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  Vol:     ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>,
  VolX:    ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>,
  Refresh: ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
  Clock:   ({s=24,c=''}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
};

/* ── Music Bars ── */
function MusicBars({ playing, cls='' }) {
  if (!playing) return (
    <div className={`flex items-end gap-0.5 ${cls}`} style={{height:28}}>
      {[8,16,10,20].map((h,i) => <div key={i} style={{width:4,height:h,background:'currentColor',borderRadius:2}}/>)}
    </div>
  );
  return (
    <div className={`flex items-end gap-0.5 ${cls}`} style={{height:28}}>
      <div style={{width:4,background:'currentColor',borderRadius:2}} className="bar1"/>
      <div style={{width:4,background:'currentColor',borderRadius:2}} className="bar2"/>
      <div style={{width:4,background:'currentColor',borderRadius:2}} className="bar3"/>
      <div style={{width:4,background:'currentColor',borderRadius:2}} className="bar4"/>
    </div>
  );
}

/* ── Timer Bar ── */
function TimerBar({ timeLeft, answered }) {
  const pct = Math.max(0, (timeLeft / ROUND_TIME) * 100);
  const col = pct > 60 ? '#4ade80' : pct > 30 ? '#fbbf24' : '#ef4444';
  return (
    <div style={{width:'100%',height:12,background:'rgba(255,255,255,0.1)',borderRadius:9999,overflow:'hidden'}}>
      <div style={{
        width:`${pct}%`,height:'100%',borderRadius:9999,
        background:col,transition:'width 0.1s linear, background 0.3s',
        boxShadow:`0 0 8px ${col}90`,
      }} className={timeLeft<=5&&!answered?'timer-blink':''}/>
    </div>
  );
}

/* ── LOADING ── */
function LoadingScreen({ categoryId, artistName }) {
  const cat = CATEGORIES.find(d => d.id === categoryId);
  const label = artistName ? `"${artistName}"` : (cat ? cat.label : 'muzyki');
  const emoji = artistName ? '🎤' : (cat ? cat.emoji : '🎵');
  const color = cat ? cat.color : '#a78bfa';
  return (
    <div className="bg-game flex items-center justify-center min-h-screen">
      <div style={{textAlign:'center'}}>
        <div style={{position:'relative',width:88,height:88,margin:'0 auto 20px'}}>
          <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid rgba(139,92,246,0.25)'}}/>
          <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid transparent',borderTopColor:color}} className="spin-slow"/>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:32}}>
            {emoji}
          </div>
        </div>
        <p style={{color:'rgba(255,255,255,0.85)',fontSize:20,fontWeight:700,margin:0}}>
          Ładowanie {label}...
        </p>
        <p style={{color:'rgba(255,255,255,0.4)',fontSize:13,marginTop:6}}>iTunes Search API</p>
      </div>
    </div>
  );
}

/* ── START SCREEN ── */
function StartScreen({ onStart, leaderboard, username, onUsernameChange }) {
  const [tab, setTab]           = useState('cat');   // 'cat' | 'artist'
  const [catId, setCatId]       = useState(null);
  const [artistInput, setArtistInput] = useState('');
  const [recentArtists, setRecentArtists] = useState(() => getRecentArtists());
  const [editingNick, setEditingNick] = useState(false);

  const cat    = CATEGORIES.find(d => d.id === catId);
  const medals = ['🥇','🥈','🥉'];
  const canPlay = tab === 'cat' ? !!catId : artistInput.trim().length >= 2;

  const handlePlay = () => {
    if (!canPlay) return;
    if (tab === 'artist') {
      const name = artistInput.trim();
      saveRecentArtist(name);
      setRecentArtists(getRecentArtists());
      onStart(null, name);
    } else {
      onStart(catId, null);
    }
  };

  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      flex:1, padding:'10px 0', borderRadius:12, border:'none', cursor:'pointer',
      fontWeight:700, fontSize:13, transition:'all 0.2s',
      background: tab===id ? 'rgba(139,92,246,0.35)' : 'transparent',
      color: tab===id ? '#c4b5fd' : 'rgba(255,255,255,0.45)',
      boxShadow: tab===id ? 'inset 0 0 0 1px rgba(139,92,246,0.5)' : 'none',
    }}>{label}</button>
  );

  return (
    <div className="bg-game" style={{minHeight:'100vh',padding:'16px 16px 24px',overflowY:'auto',position:'relative'}}>
      <div style={{position:'fixed',top:30,left:20,width:180,height:180,borderRadius:'50%',background:'rgba(59,130,246,0.07)',filter:'blur(40px)',pointerEvents:'none'}}/>
      <div style={{position:'fixed',bottom:60,right:20,width:240,height:240,borderRadius:'50%',background:'rgba(139,92,246,0.09)',filter:'blur(50px)',pointerEvents:'none'}}/>

      <div className="fade-in-up" style={{maxWidth:440,margin:'0 auto',display:'flex',flexDirection:'column',gap:16}}>

        {/* Logo + Title */}
        <div style={{textAlign:'center',paddingTop:10}}>
          <div className="pulse-glow" style={{
            width:100,height:100,borderRadius:'50%',margin:'0 auto 14px',
            background:'linear-gradient(135deg,#3b82f6,#7c3aed)',
            display:'flex',alignItems:'center',justifyContent:'center',position:'relative',
            boxShadow:'0 10px 40px rgba(139,92,246,0.5)',
          }}>
            <Ic.Music s={46} c="text-white"/>
            <div style={{position:'absolute',inset:0,borderRadius:'50%',background:'linear-gradient(135deg,rgba(255,255,255,0.28) 0%,transparent 60%)'}}/>
          </div>
          <h1 style={{fontSize:44,fontWeight:900,color:'#fff',margin:'0 0 3px',letterSpacing:-1,textShadow:'0 0 30px rgba(139,92,246,0.7)'}}>
            MUSIC
          </h1>
          <h2 style={{fontSize:26,fontWeight:900,margin:'0 0 6px',background:'linear-gradient(90deg,#60a5fa,#a78bfa,#f0abfc)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            CHALLENGE
          </h2>
          <p style={{color:'rgba(255,255,255,0.45)',fontSize:12,margin:0}}>
            Zgadnij 10 piosenek · Combo ×2 · Tabela rekordów
          </p>
        </div>

        {/* Nick */}
        <div className="card-glass" style={{borderRadius:15,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22,flexShrink:0}}>🎮</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:'rgba(255,255,255,0.4)',fontSize:10,marginBottom:2}}>TWÓJ NICK</div>
            <input
              type="text"
              value={username}
              onChange={e => onUsernameChange(e.target.value.slice(0,20))}
              onFocus={() => setEditingNick(true)}
              onBlur={() => setEditingNick(false)}
              placeholder="Wpisz nick (maks. 20 znaków)..."
              style={{
                width:'100%',background:'transparent',border:'none',outline:'none',
                color:'#fff',fontSize:15,fontWeight:700,fontFamily:'inherit',
                borderBottom: editingNick ? '1px solid rgba(139,92,246,0.6)' : '1px solid transparent',
                paddingBottom:2,transition:'border-color 0.2s',
              }}
            />
          </div>
          {username && <span style={{color:'#4ade80',fontSize:14,flexShrink:0}}>✓</span>}
        </div>


        {/* Mode tabs */}
        <div className="card-glass" style={{borderRadius:20,padding:14}}>
          {/* Tab bar */}
          <div style={{display:'flex',gap:6,marginBottom:14,background:'rgba(0,0,0,0.2)',borderRadius:14,padding:4}}>
            {tabBtn('cat',  '🎶 Gatunek / Epoka')}
            {tabBtn('artist','🎤 Artysta')}
          </div>

          {/* Category grid */}
          {tab === 'cat' && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:9}}>
              {CATEGORIES.map(d => {
                const active = catId === d.id;
                return (
                  <button key={d.id} onClick={() => setCatId(d.id)}
                    className="glossy-btn"
                    style={{
                      borderRadius:13,padding:'13px 6px',border:'2px solid',
                      borderColor: active ? d.color : 'rgba(255,255,255,0.13)',
                      background: active ? `linear-gradient(135deg,${d.color}28,${d.color}50)` : 'rgba(255,255,255,0.04)',
                      cursor:'pointer',
                      boxShadow: active ? `0 0 18px ${d.glow}` : 'none',
                      transition:'all 0.18s',
                    }}>
                    <div style={{fontSize:26,marginBottom:5}}>{d.emoji}</div>
                    <div style={{color: active ? d.color : 'rgba(255,255,255,0.65)',fontWeight:700,fontSize:11,lineHeight:1.3}}>
                      {d.label}
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {/* Artist search */}
          {tab === 'artist' && (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'flex',gap:8}}>
                <input
                  type="text"
                  value={artistInput}
                  onChange={e => setArtistInput(e.target.value)}
                  onKeyDown={e => e.key==='Enter' && handlePlay()}
                  placeholder="np. Metallica, Dua Lipa..."
                  style={{
                    flex:1,padding:'12px 14px',borderRadius:12,border:'2px solid rgba(139,92,246,0.4)',
                    background:'rgba(255,255,255,0.07)',color:'#fff',fontSize:14,outline:'none',
                    fontFamily:'inherit',
                  }}
                />
              </div>
              {/* Recent artists */}
              {recentArtists.length > 0 && (
                <div>
                  <p style={{color:'rgba(255,255,255,0.35)',fontSize:11,margin:'0 0 7px'}}>Ostatnio wyszukiwani:</p>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6}}>

            <div key={i} style={{color:'rgba(255,255,255,0.45)',fontSize:12,display:'flex',gap:7,marginBottom:3}}>

/* ── PLAYING SCREEN ── */
function PlayingScreen({ round, score, currentSong, options, timeLeft, answered, selectedOption,
  onAnswer, isMuted, onToggleMute, isAudioPlaying, audioError, lastRoundScore, showRoundScore,
  combo, multiplier, decadeId }) {

  const correctId = currentSong ? currentSong.trackId : null;
  const onFire = combo >= COMBO_THRESHOLD;
  const dec = DECADES.find(d => d.id === decadeId) || DECADES[2];

  const optCls = (opt) => {
    if (!answered) return 'option-idle';
    if (opt.trackId === correctId) return 'option-correct';
    if (selectedOption && opt.trackId === selectedOption.trackId) return 'option-wrong';
    return 'option-dim';
  };
  const optAnim = (opt) => {
    if (!answered) return '';
    if (opt.trackId === correctId) return 'anim-correct';
    if (selectedOption && opt.trackId === selectedOption.trackId) return 'anim-wrong';
    return '';
  };

  const artBig = currentSong?.artworkUrl100?.replace('100x100bb','400x400bb').replace('100x100','400x400') || null;
  const art200 = currentSong?.artworkUrl100?.replace('100x100bb','200x200bb').replace('100x100','200x200') || null;

  return (
    <div className="bg-game" style={{minHeight:'100vh',display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>

      {/* Blurred art bg — widoczne tylko po odpowiedzi */}

        <div style={{position:'absolute',inset:0,background:'rgba(10,5,30,0.72)'}}/>
        {artBig && answered && (
          <img src={artBig} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:0.22,filter:'blur(24px)',transform:'scale(1.1)',transition:'opacity 0.6s ease'}}/>
        )}
      </div>

      {/* Fire combo background glow */}
      {onFire && (
        <div className="combo-bg" style={{
          position:'absolute',inset:0,pointerEvents:'none',
          background:'radial-gradient(ellipse at center bottom, rgba(251,146,60,0.22) 0%, rgba(239,68,68,0.08) 50%, transparent 75%)',
        }}/>
      )}

      {/* Floating fire emojis when on combo */}
      {onFire && (
        <>
          <div style={{position:'fixed',left:8,bottom:80,fontSize:28,lineHeight:1,pointerEvents:'none',zIndex:10}} className="fire-f">🔥</div>
          <div style={{position:'fixed',right:8,bottom:80,fontSize:28,lineHeight:1,pointerEvents:'none',zIndex:10,animationDelay:'0.18s'}} className="fire-f">🔥</div>
          <div style={{position:'fixed',left:24,bottom:130,fontSize:18,lineHeight:1,pointerEvents:'none',zIndex:10,animationDelay:'0.35s'}} className="fire-f">🔥</div>
          <div style={{position:'fixed',right:24,bottom:130,fontSize:18,lineHeight:1,pointerEvents:'none',zIndex:10,animationDelay:'0.52s'}} className="fire-f">🔥</div>
        </>

      <div style={{position:'relative',maxWidth:480,margin:'0 auto',width:'100%',display:'flex',flexDirection:'column',gap:13,padding:'14px 16px 24px',minHeight:'100vh'}}>

        {/* Header */}
        <div className="slide-down" style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:4}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:16}}>{dec.emoji}</span>
            <span style={{color:'rgba(255,255,255,0.4)',fontSize:12}}>Runda</span>
            <span style={{color:'#fff',fontWeight:900,fontSize:20}}>{round+1}</span>
            <span style={{color:'rgba(255,255,255,0.25)',fontSize:12}}>/ {TOTAL_ROUNDS}</span>
          </div>
          <div style={{position:'relative'}}>
            <div className="card-glass" style={{borderRadius:9999,padding:'7px 14px',display:'flex',alignItems:'center',gap:7,
              border: onFire ? '1px solid rgba(251,146,60,0.5)' : '1px solid rgba(255,255,255,0.12)',
              background: onFire ? 'rgba(251,146,60,0.1)' : 'rgba(255,255,255,0.08)'}}>
              <Ic.Star s={14} c="text-yellow-400"/>
              <span style={{color:'#fbbf24',fontWeight:900,fontSize:17}}>{score.toLocaleString()}</span>
            </div>
            {showRoundScore && (
              <div className="score-float" style={{
                top:-30,left:'50%',transform:'translateX(-50%)',
                fontSize:19,fontWeight:900,whiteSpace:'nowrap',
                color: lastRoundScore > 0 ? '#4ade80' : '#f87171',
              }}>
                {lastRoundScore > 0
                  ? `+${lastRoundScore}${multiplier > 1 ? ' ×2🔥' : ''}`

              </div>
            )}
          </div>
          <button onClick={onToggleMute} className="card-glass" style={{
            borderRadius:'50%',width:36,height:36,border:'none',cursor:'pointer',
            color:'rgba(255,255,255,0.7)',display:'flex',alignItems:'center',justifyContent:'center',
            background:'rgba(255,255,255,0.08)'}}>
            {isMuted ? <Ic.VolX s={17}/> : <Ic.Vol s={17}/>}

        </div>

        {/* Round dots */}
        <div style={{display:'flex',justifyContent:'center',gap:5}}>
          {Array.from({length:TOTAL_ROUNDS},(_,i) => (
            <div key={i} style={{
              height:7,borderRadius:9999,transition:'all 0.3s',
              width: i===round ? 20 : 7,
              background: i<round ? '#a78bfa' : i===round ? '#7c3aed' : 'rgba(255,255,255,0.18)',
            }}/>
          ))}
        </div>

        {/* Combo badge */}
        {onFire && (
          <div className="combo-pop" style={{
            display:'flex',alignItems:'center',justifyContent:'center',gap:8,
            background:'linear-gradient(135deg,rgba(239,68,68,0.3),rgba(251,146,60,0.3))',
            border:'2px solid rgba(251,146,60,0.6)',
            borderRadius:12,padding:'9px 16px',
            boxShadow:'0 0 20px rgba(251,146,60,0.3)',
          }}>
            <span style={{fontSize:22}} className="fire-f">🔥</span>
            <span style={{color:'#fb923c',fontWeight:900,fontSize:16,letterSpacing:1}}>COMBO ×2!</span>
            <span style={{color:'rgba(255,255,255,0.6)',fontSize:13}}>{combo} z rzędu</span>
            <span style={{fontSize:22}} className="fire-f">🔥</span>
          </div>
        )}

        {/* Timer */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
            <div style={{display:'flex',alignItems:'center',gap:5,color:'rgba(255,255,255,0.5)',fontSize:12}}>
              <Ic.Clock s={12}/>
              <span className={timeLeft<=5&&!answered?'timer-blink':''}
                style={{color:timeLeft<=5&&!answered?'#f87171':'inherit',fontWeight:timeLeft<=5?700:400}}>
                {Math.ceil(timeLeft)}s
              </span>
            </div>
            {audioError && <span style={{color:'#fb923c',fontSize:11}}>⚠ Brak dźwięku</span>}
          </div>

        </div>

        {/* Album art */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'6px 0'}}>
          <div style={{position:'relative'}}>
            {/* Placeholder przed odpowiedzią, okładka po */}
            {answered && art200 ? (
              <img src={art200} alt="album" className="reveal-art" style={{width:120,height:120,borderRadius:16,objectFit:'cover',
                boxShadow:'0 20px 60px rgba(0,0,0,0.55),0 0 30px rgba(139,92,246,0.3)'}}/>
            ) : (
              <div style={{width:120,height:120,borderRadius:16,
                background:'linear-gradient(135deg,#1e1b4b,#312e81)',
                border:'2px solid rgba(139,92,246,0.35)',
                display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,
                boxShadow:'0 20px 60px rgba(0,0,0,0.5)'}}>
                <span style={{fontSize:36}}>🎵</span>
                <span style={{color:'rgba(255,255,255,0.3)',fontSize:11,fontWeight:600}}>???</span>
              </div>
            )}
            <div style={{position:'absolute',inset:0,borderRadius:16,
              background:'linear-gradient(135deg,rgba(255,255,255,0.18) 0%,transparent 55%)',
              pointerEvents:'none'}}/>
          </div>
          <div style={{marginTop:10,color:'#a78bfa',display:'flex',alignItems:'center',gap:7,opacity:answered?0.45:1}}>
            <MusicBars playing={!answered&&isAudioPlaying} cls="text-purple-400"/>
            <span style={{color:'rgba(255,255,255,0.5)',fontSize:12}}>
              {answered ? 'Zatrzymano' : 'Odtwarza się...'}
            </span>
          </div>
          <p style={{color:'rgba(255,255,255,0.65)',fontSize:14,fontWeight:600,marginTop:5}}>
            🎵 Jaki to utwór?
          </p>
        </div>

        {/* Options */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {options.map((opt,idx) => {
            const isCorr = opt.trackId === correctId;
            const isWrong = selectedOption && opt.trackId === selectedOption.trackId && !isCorr;
            return (
              <button key={opt.trackId+'-'+idx} onClick={() => onAnswer(opt)} disabled={answered}
                className={`glossy-btn ${optCls(opt)} ${optAnim(opt)}`}
                style={{borderRadius:15,padding:'13px 15px',textAlign:'left',
                  display:'flex',alignItems:'center',gap:11,width:'100%',
                  cursor:answered?'default':'pointer',transition:'all 0.2s'}}>
                <div style={{
                  width:30,height:30,borderRadius:'50%',flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:12,
                  background: answered&&isCorr?'rgba(34,197,94,0.3)':answered&&isWrong?'rgba(239,68,68,0.3)':'rgba(255,255,255,0.1)',
                  color: answered&&isCorr?'#4ade80':answered&&isWrong?'#f87171':'rgba(255,255,255,0.55)',
                }}>
                  {answered&&isCorr?<Ic.Check s={14}/>:answered&&isWrong?<Ic.X s={14}/>:String.fromCharCode(65+idx)}

                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:'#fff',fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>

                  </div>

                    {opt.artistName}
                  </div>
                </div>
                {answered && isCorr && selectedOption?.trackId === opt.trackId && (
                  <div style={{flexShrink:0,color:'#4ade80',fontWeight:800,fontSize:12}}>
                    +{lastRoundScore}{multiplier>1?' ×2':''}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ── RESULT SCREEN ── */
function ResultScreen({ score, isNewHS, history, leaderboard, lbPosition, decadeId, artistName, onPlayAgain }) {
  const maxScore = TOTAL_ROUNDS * (BASE_PTS + ROUND_TIME * TIME_MULT);
  const pct = Math.round((score / maxScore) * 100);
  const correct = history.filter(h => h.correct).length;
  const maxCombo = history.reduce((acc,h,i) => {
    if (!h.correct) return acc;
    let run = 1;
    for (let j=i+1; j<history.length && history[j].correct; j++) run++;
    return Math.max(acc, run);
  }, 0);
  const dec = CATEGORIES.find(d => d.id === decadeId) || CATEGORIES[0];
  const modeLabel = artistName ? `🎤 ${artistName}` : `${dec.emoji} ${dec.label}`;
  const modeGlow  = artistName ? 'rgba(167,139,250,0.5)' : dec.glow;
  const medals = ['🥇','🥈','🥉'];
  const rank = pct>=90?['🏆','Legenda!','#fbbf24']:pct>=70?['🌟','Mistrz!','#a78bfa']:pct>=50?['🎵','Ekspert!','#60a5fa']:pct>=30?['🎶','Amator','#34d399']:['🎸','Nowicjusz','#fb923c'];

  return (
    <div className="bg-game" style={{minHeight:'100vh',padding:16,overflowY:'auto'}}>
      <div className="fade-in-up" style={{maxWidth:460,margin:'0 auto',paddingTop:20,paddingBottom:32,display:'flex',flexDirection:'column',gap:16}}>

        {/* Header */}
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:48,marginBottom:8}}>🏁</div>
          <h2 style={{fontSize:28,fontWeight:900,color:'#fff',margin:'0 0 3px'}}>Koniec gry!</h2>
          <p style={{color:'rgba(255,255,255,0.45)',margin:0,fontSize:13}}>{modeLabel}</p>
        </div>

        {/* Score card */}
        <div className="card-glass" style={{borderRadius:22,padding:24,textAlign:'center',
          boxShadow:`0 20px 60px rgba(0,0,0,0.3),0 0 40px ${modeGlow}30`}}>
          {isNewHS && (
            <div style={{display:'inline-flex',alignItems:'center',gap:8,marginBottom:12,
              background:'rgba(251,191,36,0.15)',borderRadius:9999,padding:'5px 14px',
              border:'1px solid rgba(251,191,36,0.3)'}}>
              <Ic.Trophy s={14} c="text-yellow-400"/>
              <span style={{color:'#fbbf24',fontWeight:700,fontSize:12}}>NOWY REKORD!</span>
            </div>
          )}
          {lbPosition && (
            <div style={{display:'inline-flex',alignItems:'center',gap:8,marginBottom:12,
              background:'rgba(139,92,246,0.15)',borderRadius:9999,padding:'5px 14px',
              border:'1px solid rgba(139,92,246,0.3)',marginLeft:8}}>
              <span style={{fontSize:14}}>{medals[lbPosition-1] || `#${lbPosition}`}</span>
              <span style={{color:'#a78bfa',fontWeight:700,fontSize:12}}>#{lbPosition} w tabeli</span>
            </div>
          )}
          <div style={{fontSize:60,fontWeight:900,lineHeight:1,marginBottom:4,
            background:'linear-gradient(90deg,#60a5fa,#a78bfa)',
            WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            {score.toLocaleString()}
          </div>
          <div style={{color:'rgba(255,255,255,0.35)',fontSize:13,marginBottom:16}}>punktów</div>
          <div style={{fontSize:22,fontWeight:700,marginBottom:16,color:rank[2]}}>{rank[0]} {rank[1]}</div>
          <div style={{width:'100%',height:9,background:'rgba(255,255,255,0.1)',borderRadius:9999,overflow:'hidden',marginBottom:6}}>
            <div style={{height:'100%',borderRadius:9999,
              background:`linear-gradient(90deg,${dec.color},#8b5cf6)`,
              width:`${pct}%`,transition:'width 1.2s ease-out'}}/>
          </div>
          <div style={{color:'rgba(255,255,255,0.3)',fontSize:11}}>{pct}% maksymalnego wyniku</div>
        </div>

        {/* Stats */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
          {[
            ['Poprawne', correct, '#4ade80'],
            ['Błędne', TOTAL_ROUNDS-correct, '#f87171'],
            ['Max combo', maxCombo, '#fb923c'],
          ].map(([label,val,col],i) => (
            <div key={i} className="card-glass" style={{borderRadius:14,padding:'12px 8px',textAlign:'center'}}>
              <div style={{fontSize:22,fontWeight:900,color:col,marginBottom:2}}>{val}{i===2&&val>=COMBO_THRESHOLD?'🔥':''}</div>
              <div style={{color:'rgba(255,255,255,0.4)',fontSize:11}}>{label}</div>
            </div>
          ))}
        </div>

        {/* Leaderboard */}
        {leaderboard.length > 0 && (
          <div className="card-glass" style={{borderRadius:18,overflow:'hidden'}}>
            <div style={{padding:'11px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',display:'flex',alignItems:'center',gap:7}}>
              <Ic.Trophy s={15} c="text-yellow-400"/>
              <span style={{color:'rgba(255,255,255,0.8)',fontWeight:700,fontSize:13}}>Tabela wyników</span>
              <span style={{marginLeft:'auto',fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:9999,
                background: FIREBASE_ENABLED ? 'rgba(16,185,129,0.18)' : 'rgba(255,255,255,0.08)',
                color: FIREBASE_ENABLED ? '#34d399' : 'rgba(255,255,255,0.35)',
                border: FIREBASE_ENABLED ? '1px solid rgba(52,211,153,0.35)' : '1px solid rgba(255,255,255,0.12)',
              }}>{FIREBASE_ENABLED ? '🌍 Globalna' : '💾 Lokalna'}</span>
            </div>
            {leaderboard.slice(0,5).map((e,i) => (
              <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'9px 16px',
                borderBottom: i<Math.min(leaderboard.length,5)-1?'1px solid rgba(255,255,255,0.05)':'none',
                background: e.score===score&&i===(lbPosition-1) ? 'rgba(139,92,246,0.12)' : i===0?'rgba(251,191,36,0.05)':'transparent',
              }}>
                <span style={{fontSize:16,width:22,textAlign:'center'}}>{medals[i]||`${i+1}`}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:i===0?'#fbbf24':i===1?'#e2e8f0':i===2?'#fb923c':'rgba(255,255,255,0.55)',fontWeight:700,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {e.username || 'Gracz'}
                  </div>
                  <div style={{color:'rgba(255,255,255,0.4)',fontSize:11}}>{e.score.toLocaleString()} pkt</div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,flexShrink:0}}>
                  <span style={{fontSize:12}}>{e.artistName ? '🎤' : (CATEGORIES.find(d=>d.id===(e.category||e.decade))?.emoji||'🎵')}</span>
                  <span style={{color:'rgba(255,255,255,0.25)',fontSize:10}}>{e.date}</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Round history */}
        <div className="card-glass" style={{borderRadius:18,overflow:'hidden'}}>
          <div style={{padding:'11px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)'}}>
            <span style={{color:'rgba(255,255,255,0.8)',fontWeight:700,fontSize:13}}>Historia rund</span>
          </div>
          {history.map((item,i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'10px 16px',
              borderBottom: i<history.length-1?'1px solid rgba(255,255,255,0.05)':'none'}}>
              <div style={{width:22,height:22,borderRadius:'50%',flexShrink:0,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,
                background:item.correct?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.2)',
                color:item.correct?'#4ade80':'#f87171'}}>
                {item.correct?'✓':'✗'}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:'#fff',fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {item.song.trackName}
                </div>
                <div style={{color:'rgba(255,255,255,0.35)',fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {item.song.artistName}
                </div>
              </div>
              <div style={{flexShrink:0,fontWeight:800,fontSize:12,color:item.correct?'#4ade80':'#f87171'}}>
                {item.correct?`+${item.score}`:'0'}{item.multiplier>1?' 🔥':''}
              </div>
            </div>
          ))}
        </div>

        <button onClick={onPlayAgain} className="glossy-btn" style={{
          width:'100%',padding:'17px 0',borderRadius:18,fontSize:17,fontWeight:900,
          color:'#fff',border:'none',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',gap:10,
          background:'linear-gradient(135deg,#3b82f6 0%,#7c3aed 50%,#8b5cf6 100%)',
          boxShadow:'0 10px 40px rgba(139,92,246,0.5)',
        }}>
          <Ic.Refresh s={19}/> ZAGRAJ PONOWNIE
        </button>
      </div>
    </div>
  );
}

/* ── MAIN APP ── */
function App() {
  const [gameState, setGameState]       = useState('START_SCREEN');
  const [roundIndex, setRoundIndex]     = useState(0);
  const [score, setScore]               = useState(0);
  const [currentSong, setCurrentSong]   = useState(null);
  const [options, setOptions]           = useState([]);
  const [timeLeft, setTimeLeft]         = useState(ROUND_TIME);
  const [answered, setAnswered]         = useState(false);
  const [selectedOption, setSelectedOption] = useState(null);
  const [history, setHistory]           = useState([]);
  const [isMuted, setIsMuted]           = useState(false);
  const [audioError, setAudioError]     = useState(false);
  const [isAudioPlaying, setIsAudioPlaying] = useState(false);
  const [leaderboard, setLeaderboard]   = useState(() => getLBLocal());
  const [isNewHS, setIsNewHS]           = useState(false);
  const [lbPosition, setLbPosition]     = useState(null);
  const [roundKey, setRoundKey]         = useState(0);
  const [lastRoundScore, setLastRoundScore] = useState(0);
  const [showRoundScore, setShowRoundScore] = useState(false);
  const [combo, setCombo]               = useState(0);
  const [multiplier, setMultiplier]     = useState(1);
  const [selectedDecade, setSelectedDecade] = useState(null);
  const [artistName, setArtistName]     = useState(null);
  const [username, setUsername]         = useState(() => localStorage.getItem(UN_KEY) || '');

  /* refs */
  const audioRef        = useRef(new Audio());
  const answeredRef     = useRef(false);
  const timeLeftRef     = useRef(ROUND_TIME);
  const songsRef        = useRef([]);
  const currentSongRef  = useRef(null);
  const scoreRef        = useRef(0);
  const historyRef      = useRef([]);
  const isMutedRef      = useRef(false);
  const roundIndexRef   = useRef(0);
  const comboRef        = useRef(0);
  const artistNameRef   = useRef(null);
  const usernameRef     = useRef(localStorage.getItem(UN_KEY) || '');

  /* ── load global leaderboard on mount ── */
  useEffect(() => { loadLB().then(lb => setLeaderboard(lb)); }, []);

  /* ── loadRound ── */
  const loadRound = useCallback((idx, songList) => {
    const pool = [...songList].sort(() => Math.random() - 0.5);
    const correct = pool[0];
    /* prefer wrong options from different artists */
    const diffArtist = pool.filter(s => s.artistName !== correct.artistName);
    const sameOk     = pool.filter(s => s.trackId !== correct.trackId);
    const wrongs     = diffArtist.length >= 3 ? diffArtist.slice(0,3) : sameOk.slice(0,3);
    const allOpts    = [correct, ...wrongs].sort(() => Math.random() - 0.5);

    currentSongRef.current = correct;
    answeredRef.current    = false;
    timeLeftRef.current    = ROUND_TIME;
    roundIndexRef.current  = idx;

    setCurrentSong(correct);
    setOptions(allOpts);
    setAnswered(false);
    setSelectedOption(null);
    setAudioError(false);
    setIsAudioPlaying(false);
    setTimeLeft(ROUND_TIME);
    setRoundIndex(idx);
    setRoundKey(k => k + 1);
    setGameState('PLAYING');

    const audio = audioRef.current;
    audio.pause();
    audio.src = correct.previewUrl;
    audio.volume = isMutedRef.current ? 0 : 0.7;
    audio.play().then(() => setIsAudioPlaying(true)).catch(() => setAudioError(true));
  }, []);

  /* ── handleAnswer ── */
  const handleAnswer = useCallback((option) => {
    if (answeredRef.current) return;
    answeredRef.current = true;

    const correct    = currentSongRef.current;
    const isCorrect  = option !== null && option.trackId === correct.trackId;

    /* combo first: new combo determines multiplier */
    const newCombo   = isCorrect ? comboRef.current + 1 : 0;
    const mult       = newCombo >= COMBO_THRESHOLD ? 2 : 1;
    comboRef.current = newCombo;

    const timeBonus  = Math.floor(timeLeftRef.current) * TIME_MULT;
    const roundScore = isCorrect ? (BASE_PTS + timeBonus) * mult : 0;

    scoreRef.current += roundScore;
    const newScore = scoreRef.current;

    const result = { song: correct, correct: isCorrect, score: roundScore, multiplier: mult };
    historyRef.current = [...historyRef.current, result];

    setCombo(newCombo);
    setMultiplier(mult);
    setAnswered(true);
    setSelectedOption(option);
    setScore(newScore);
    setHistory([...historyRef.current]);
    setLastRoundScore(roundScore);
    setShowRoundScore(true);
    setTimeout(() => setShowRoundScore(false), 1900);

    setTimeout(async () => {
      audioRef.current.pause();
      const nextIdx = roundIndexRef.current + 1;
      if (nextIdx >= TOTAL_ROUNDS) {
        const today = new Date().toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'2-digit'});
        const entry = { score: newScore, date: today,
          category: selectedDecade, artistName: artistNameRef.current || null,
          username: usernameRef.current || 'Gracz' };
        const newLB = await saveLB(entry);
        setLeaderboard(newLB);
        const pos = newLB.findIndex(e => e.score === newScore);
        setLbPosition(pos === -1 ? null : pos + 1);
        setIsNewHS(pos === 0);
        setGameState('RESULT_SCREEN');
      } else {
        loadRound(nextIdx, songsRef.current);
      }
    }, 2000);
  }, [loadRound, selectedDecade]);

  /* ── timer ── */
  useEffect(() => {
    if (gameState !== 'PLAYING') return;
    const interval = setInterval(() => {
      if (answeredRef.current) { clearInterval(interval); return; }
      timeLeftRef.current = Math.max(0, parseFloat((timeLeftRef.current - 0.1).toFixed(1)));
      setTimeLeft(timeLeftRef.current);
      if (timeLeftRef.current <= 0) {
        clearInterval(interval);
        if (!answeredRef.current) handleAnswer(null);
      }
    }, 100);
    return () => clearInterval(interval);
  }, [roundKey, gameState, handleAnswer]);

  const handleUsernameChange = useCallback((val) => {
    setUsername(val);
    usernameRef.current = val;
    localStorage.setItem(UN_KEY, val);
  }, []);

  /* ── fetchSongs ── */
  const fetchSongs = useCallback(async (categoryId, artist) => {
    setSelectedDecade(categoryId);
    setArtistName(artist || null);
    artistNameRef.current = artist || null;
    setGameState('LOADING');

    try {
      let valid;
      if (artist) {
        /* artist mode: single targeted fetch */
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(artist)}&entity=song&limit=50&attribute=artistTerm&country=US`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        valid = (data.results || []).filter(s => s.previewUrl && s.trackName && s.artistName);
      } else {
        /* category mode: fetch ALL terms in parallel, merge, diversify */
        const cat   = CATEGORIES.find(d => d.id === categoryId);
        const terms = cat ? cat.terms : ['pop hits'];
        const results = await Promise.all(
          terms.map(term =>
            fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=50&country=US`)
              .then(r => r.ok ? r.json() : { results: [] })
              .then(d => (d.results || []).filter(s => s.previewUrl && s.trackName && s.artistName))
              .catch(() => [])
          )
        );
        /* deduplicate by trackId */
        const byId = new Map();
        for (const song of results.flat()) byId.set(song.trackId, song);
        /* cap at 5 songs per artist for variety */
        const artistCount = {};
        valid = [...byId.values()].filter(s => {
          const k = s.artistName.toLowerCase();
          return (artistCount[k] = (artistCount[k] || 0) + 1) <= 5;
        });
        /* shuffle to mix artists */
        valid = valid.sort(() => Math.random() - 0.5);
      }
      if (valid.length < 4) throw new Error('Too few songs with previews');
      songsRef.current = valid;

      scoreRef.current  = 0;
      historyRef.current = [];
      comboRef.current  = 0;
      setScore(0);
      setHistory([]);
      setCombo(0);
      setMultiplier(1);
      setIsNewHS(false);
      setLbPosition(null);
      loadRound(0, valid);
    } catch (err) {
      console.error(err);
      alert('Nie udało się załadować piosenek. Sprawdź połączenie i spróbuj ponownie.');
      setGameState('START_SCREEN');
    }
  }, [loadRound]);

  const handleToggleMute = useCallback(() => {
    setIsMuted(m => {
      const next = !m;
      isMutedRef.current = next;
      audioRef.current.volume = next ? 0 : 0.7;
      return next;
    });
  }, []);

  useEffect(() => () => { audioRef.current.pause(); }, []);

  /* ── render ── */
  if (gameState === 'START_SCREEN')
    return <StartScreen onStart={fetchSongs} leaderboard={leaderboard} username={username} onUsernameChange={handleUsernameChange}/>;
  if (gameState === 'LOADING')
    return <LoadingScreen categoryId={selectedDecade} artistName={artistName}/>;
  if (gameState === 'RESULT_SCREEN')
    return <ResultScreen score={score} isNewHS={isNewHS} history={history}
      leaderboard={leaderboard} lbPosition={lbPosition}
      decadeId={selectedDecade} artistName={artistName}
      onPlayAgain={() => setGameState('START_SCREEN')}/>;

  return (
    <PlayingScreen
      round={roundIndex} score={score}
      currentSong={currentSong} options={options}
      timeLeft={timeLeft} answered={answered} selectedOption={selectedOption}
      onAnswer={handleAnswer} isMuted={isMuted} onToggleMute={handleToggleMute}
      isAudioPlaying={isAudioPlaying} audioError={audioError}
      lastRoundScore={lastRoundScore} showRoundScore={showRoundScore}
      combo={combo} multiplier={multiplier} decadeId={selectedDecade}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
